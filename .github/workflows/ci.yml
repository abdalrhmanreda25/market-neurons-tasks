name: Verify build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Firebase config
        # These are public web-app values (they ship inside the JS bundle), so
        # the repo defaults keep the build green. Set repository secrets with
        # the same names to point a build at a different Firebase project.
        run: |
          cat > .env.local <<'ENV'
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY || 'AIzaSyDEAUW087oys93F5PAB9BeIqlfGtqqu7LQ' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN || 'secretcomms-6de0e.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID || 'secretcomms-6de0e' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET || 'secretcomms-6de0e.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '49266914884' }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID || '1:49266914884:web:950b363ccaa6d715392e11' }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID || 'G-4Q97LP257N' }}
          ENV

      - name: Build
        run: npm run build

      - name: Check the export is complete
        run: |
          set -e
          required="index.html 404.html .htaccess logo.svg \
            login/index.html dashboard/index.html tasks/index.html task/index.html \
            team/index.html hours/index.html profile/index.html settings/index.html"
          missing=""
          for f in $required; do
            [ -e "out/$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing from the export:$missing"
            exit 1
          fi
          echo "All expected files present. Export size: $(du -sh out | cut -f1)"

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out/
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### Build verified :white_check_mark:"
            echo ""
            echo "Download the **site** artifact below, unzip it, and upload its"
            echo "contents into \`public_html\` on Hostinger."
            echo ""
            echo "| Page | |"
            echo "|---|---|"
            for f in index login dashboard tasks task team hours profile settings; do
              p="out/$f/index.html"; [ "$f" = "index" ] && p="out/index.html"
              [ -e "$p" ] && echo "| /$f | ok |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
