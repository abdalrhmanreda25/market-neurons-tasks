name: Deploy to Hostinger

# Manual only, on purpose: pushing files onto the live site should be a
# deliberate click, not a side effect of every commit.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Remote directory on Hostinger (the subdomain document root)'
        required: true
        # Hostinger puts a subdomain's files here. If your hPanel File Manager
        # shows the subdomain under public_html instead, use /public_html/tasks/.
        default: '/domains/tasks.marketneurons.tech/public_html/'

jobs:
  deploy:
    name: Build and upload over FTP
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check FTP credentials are configured
        run: |
          missing=""
          [ -n "${{ secrets.FTP_SERVER }}" ]   || missing="$missing FTP_SERVER"
          [ -n "${{ secrets.FTP_USERNAME }}" ] || missing="$missing FTP_USERNAME"
          [ -n "${{ secrets.FTP_PASSWORD }}" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first (Settings -> Secrets and variables -> Actions):$missing"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write Firebase config
        run: |
          cat > .env.local <<'ENV'
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY || 'AIzaSyDEAUW087oys93F5PAB9BeIqlfGtqqu7LQ' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN || 'secretcomms-6de0e.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID || 'secretcomms-6de0e' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET || 'secretcomms-6de0e.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '49266914884' }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID || '1:49266914884:web:950b363ccaa6d715392e11' }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID || 'G-4Q97LP257N' }}
          ENV

      - name: Build static export
        run: npm run build

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ inputs.target }}
          dangerous-clean-slate: false

      - name: Summary
        run: |
          echo "### Deployed to \`${{ inputs.target }}\` :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Remember: the site's domain must be listed under Firebase Console -> Authentication -> Settings -> Authorized domains, or sign-in will fail." >> "$GITHUB_STEP_SUMMARY"
